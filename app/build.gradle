plugins { id 'com.android.application' }

android {
    namespace 'com.pnntrn.cctv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pnntrn.cctv'
        minSdk 26
        targetSdk 35
        versionCode 1014
        versionName '0.4.6'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (System.getenv('CCTV_KEYSTORE_PATH')) {
            retained {
                storeFile file(System.getenv('CCTV_KEYSTORE_PATH'))
                storePassword System.getenv('CCTV_STORE_PASSWORD')
                keyAlias System.getenv('CCTV_KEY_ALIAS')
                keyPassword System.getenv('CCTV_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // ARM TV package stays below the legacy updater's 64 MiB limit.
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
            if (System.getenv('CCTV_KEYSTORE_PATH')) signingConfig signingConfigs.retained
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    lint { abortOnError true }
}

dependencies {
    // Pinned playback engines; libVLC is used for mainstream compatibility.
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation project(':rtsp-compat')
    implementation 'org.videolan.android:libvlc-all:3.7.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
