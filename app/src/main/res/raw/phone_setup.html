<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCTV · Phone setup</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b111b;color:#eef4fc;font:16px/1.5 system-ui,sans-serif;padding:24px 18px}main{max-width:520px;margin:auto}.brand{color:#65dfca;letter-spacing:3px;font-weight:800;font-size:25px}h1{font-size:27px;margin:20px 0 8px}p{color:#aab9ce}label{display:grid;gap:6px;margin:14px 0;font-size:14px;color:#bdc9da}input,select,button{font:inherit;border-radius:10px;padding:13px;width:100%;min-height:48px}input,select{background:#142032;border:1px solid #3b4b61;color:#f0f5ff}button{border:0;background:#65dfca;color:#07221e;font-weight:650;margin-top:10px}button.secondary{background:#213147;color:#edf5ff}button:disabled{opacity:.45}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}#status{padding:14px 0;color:#82e4d0}[hidden]{display:none!important}:focus-visible{outline:3px solid #f2c66a;outline-offset:3px}.note{font-size:13px}
</style></head><body><main><div class="brand">CCTV</div><section id="pair"><h1>Connect to your TV</h1><p>Enter the pairing code shown on the TV.</p><label>Pairing code<input id="pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><button id="connect">Connect</button></section><section id="setup" hidden><h1 id="location">Camera setup</h1><p>Changes are saved on your TV.</p><label>Recorder or camera<select id="device"><option value="">+ Add recorder</option></select></label><form id="form"><label>Device type<select id="preset"><option value="HIKVISION">Hikvision NVR</option><option value="VIGI_NVR">VIGI NVR</option><option value="VIGI_CAMERA">VIGI standalone camera</option><option value="CUSTOM">Custom RTSP camera</option></select></label><label>Name<input id="name" value="NVR" maxlength="100" required></label><div id="nvr"><label>IP address or hostname<input id="host" placeholder="192.168.0.10" autocapitalize="none" spellcheck="false"></label><div class="row"><label>RTSP port<input id="port" type="number" min="1" max="65535" value="554"></label><label>First channel<input id="first" type="number" min="1" max="256" value="1"></label></div><label>Username<input id="username" value="admin" autocomplete="off" autocapitalize="none"></label><label id="password-label">Password<input id="password" type="password" autocomplete="new-password"></label><div class="row"><label>Channels<input id="count" type="number" min="1" max="256" value="16"></label><label>Camera name prefix<input id="prefix" value="Camera"></label></div></div><div id="custom" hidden><label>Substream RTSP URL<input id="sub" type="password" autocomplete="new-password"></label><label>Mainstream RTSP URL<input id="main" type="password" autocomplete="new-password"></label></div><button id="test" type="submit">Test connection</button><button id="save" type="button" class="secondary" disabled>Save to TV</button></form><p class="note">Use your trusted Wi-Fi. This temporary page closes when you leave pairing on the TV. Nothing is uploaded to a cloud service.</p></section><div id="status" role="status" aria-live="polite"></div></main><script>
const $=id=>document.getElementById(id);let config={devices:[],cameras:[]},proof='';
async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.message||'Session ended. Reopen pairing on the TV.');return j}
function tell(s){$('status').textContent=s}function resetProof(){proof='';$('save').disabled=true}function type(){const custom=$('preset').value==='CUSTOM';$('custom').hidden=!custom;$('nvr').hidden=custom;if($('preset').value==='VIGI_CAMERA')$('count').value='1';resetProof()}
async function load(){config=await api('config');$('location').textContent=config.location+' · Setup';const select=$('device'),chosen=select.value;select.replaceChildren(new Option('+ Add recorder',''));config.devices.forEach(n=>select.add(new Option(n.name,n.id)));config.cameras.forEach(c=>select.add(new Option(c.name,'camera:'+c.id)));select.value=chosen}
$('connect').onclick=async()=>{try{await api('pair',{pin:$('pin').value});await load();$('pair').hidden=true;$('setup').hidden=false;tell('Connected to TV')}catch(e){tell(e.message)}};
$('preset').onchange=type;$('form').oninput=resetProof;
$('device').onchange=()=>{resetProof();const value=$('device').value;$('form').reset();if(value.startsWith('camera:')){const c=config.cameras.find(c=>'camera:'+c.id===value);$('preset').value='CUSTOM';$('name').value=c.name;$('sub').placeholder='Blank keeps saved URL';$('main').placeholder='Blank keeps saved URL'}else{const n=config.devices.find(n=>n.id===value);if(n){['preset','name','host','port','first','username','count','prefix'].forEach(k=>$(k).value=n[k]);$('password').placeholder='Blank keeps saved password'}else{$('password').placeholder='';$('sub').placeholder='';$('main').placeholder=''}}type()};
$('form').onsubmit=async e=>{e.preventDefault();$('test').disabled=true;resetProof();tell('Checking the first channel…');try{let body={id:$('device').value};['preset','name','host','port','first','username','count','prefix','password','sub','main'].forEach(k=>body[k]=$(k).value);const j=await api('test',body);tell(j.message);if(j.okay){proof=j.proof;$('save').disabled=false}}catch(e){tell(e.message)}finally{$('test').disabled=false}};
$('save').onclick=async()=>{if(!proof)return;$('save').disabled=true;try{const j=await api('save',{proof});tell(j.message);proof='';await load()}catch(e){tell(e.message)}};
</script></body></html>
