<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCTV · ตั้งค่าผ่านมือถือ</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b111b;color:#eef4fc;font:16px/1.5 system-ui,sans-serif;padding:24px 18px}main{max-width:520px;margin:auto}.brand{color:#65dfca;letter-spacing:3px;font-weight:800;font-size:25px}h1{font-size:27px;margin:20px 0 8px}p{color:#aab9ce}label{display:grid;gap:6px;margin:14px 0;font-size:14px;color:#bdc9da}input,select,button{font:inherit;border-radius:10px;padding:13px;width:100%;min-height:48px}input,select{background:#142032;border:1px solid #3b4b61;color:#f0f5ff}button{border:0;background:#65dfca;color:#07221e;font-weight:650;margin-top:10px}button.secondary{background:#213147;color:#edf5ff}button:disabled{opacity:.45}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}#status{padding:14px 0;color:#82e4d0}[hidden]{display:none!important}:focus-visible{outline:3px solid #f2c66a;outline-offset:3px}.note{font-size:13px}
</style></head><body><main><div class="brand">CCTV</div><section id="pair"><h1>เชื่อมต่อกับทีวี</h1><p>กรอกรหัสจับคู่ที่แสดงบนทีวี</p><label>รหัสจับคู่<input id="pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><button id="connect">เชื่อมต่อ</button></section><section id="setup" hidden><h1 id="location">ตั้งค่ากล้อง</h1><p>บันทึกการตั้งค่าไว้บนทีวี</p><label>เครื่องบันทึก NVR<select id="device"><option value="">+ เพิ่มเครื่องบันทึก</option></select></label><form id="form"><label>ประเภทอุปกรณ์<select id="preset"><option value="HIKVISION">Hikvision NVR</option><option value="VIGI_NVR">VIGI NVR</option></select></label><label>ชื่อ<input id="name" value="NVR" maxlength="100" required></label><div id="nvr"><label>IP หรือชื่อโฮสต์<input id="host" placeholder="192.168.0.10" autocapitalize="none" spellcheck="false"></label><div class="row"><label>พอร์ต RTSP<input id="port" type="number" min="1" max="65535" value="554"></label><label>ช่องเริ่มต้น<input id="first" type="number" min="1" max="256" value="1"></label></div><label>ชื่อผู้ใช้<input id="username" value="admin" autocomplete="off" autocapitalize="none"></label><label id="password-label">รหัสผ่าน<input id="password" type="password" autocomplete="new-password"></label><div class="row"><label>จำนวนช่อง<input id="count" type="number" min="1" max="256" value="16"></label><label>คำนำหน้าชื่อกล้อง<input id="prefix" value="กล้อง"></label></div></div><button id="test" type="submit">ทดสอบการเชื่อมต่อ</button><button id="save" type="button" class="secondary" disabled>ส่งให้ทีวีทดสอบและยืนยัน</button></form><p class="note">ใช้ Wi-Fi ที่คุณเชื่อถือ หน้านี้จะปิดเมื่อออกจากการจับคู่บนทีวี ข้อมูลจะไม่ถูกส่งไปยังบริการคลาวด์</p></section><div id="status" role="status" aria-live="polite"></div></main><script>
const $=id=>document.getElementById(id);let config={devices:[]},proof='';
async function api(path,data){let r,j;try{r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});j=await r.json()}catch(e){throw Error('เชื่อมต่อทีวีไม่ได้ ตรวจสอบ Wi-Fi หรือเปิดจับคู่บนทีวีอีกครั้ง')}if(!r.ok)throw Error(j.message||'การจับคู่สิ้นสุดแล้ว เปิดจับคู่บนทีวีอีกครั้ง');return j}
function tell(s){$('status').textContent=s}function resetProof(){proof='';$('save').disabled=true}
function fill(){resetProof();$('form').reset();const n=config.devices.find(n=>n.id===$('device').value);if(n){['preset','name','host','port','first','username','count','prefix'].forEach(k=>$(k).value=n[k]);$('password').placeholder='เว้นว่างเพื่อใช้รหัสผ่านเดิม'}else $('password').placeholder=''}
async function load(){config=await api('config');$('location').textContent=config.location+' · ตั้งค่า NVR';const s=$('device');s.replaceChildren();if(config.devices.length)config.devices.forEach(n=>s.add(new Option(n.name,n.id)));else s.add(new Option('+ เพิ่มเครื่องบันทึก',''));fill()}
$('connect').onclick=async()=>{try{await api('pair',{pin:$('pin').value});await load();$('pair').hidden=true;$('setup').hidden=false;tell('เชื่อมต่อทีวีแล้ว')}catch(e){tell(e.message)}};
$('form').oninput=resetProof;$('device').onchange=fill;
$('form').onsubmit=async e=>{e.preventDefault();$('test').disabled=true;resetProof();tell('กำลังตรวจสอบช่องแรก…');try{let body={id:$('device').value};['preset','name','host','port','first','username','count','prefix','password'].forEach(k=>body[k]=$(k).value);const j=await api('test',body);tell(j.message);if(j.okay){proof=j.proof;$('save').disabled=false}}catch(e){tell(e.message)}finally{$('test').disabled=false}};
$('save').onclick=async()=>{if(!proof)return;$('save').disabled=true;try{const j=await api('save',{proof});proof='';tell(j.message);if(!j.pendingTv)await load()}catch(e){tell(e.message)}};
</script></body></html>
