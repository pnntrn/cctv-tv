name: Prepare APK signing tool
on:
  push:
    branches: [build/signing-tools]
permissions:
  contents: read
jobs:
  tool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;35.0.0'
      - run: |
          mkdir -p signing-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tool/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: apk-signing-tool
          path: signing-tool/
          retention-days: 1
