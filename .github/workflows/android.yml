name: Build Android TV APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check core behavior
        run: bash scripts/check-core.sh
      - name: Test, lint, and build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/cctv-tv-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/cctv-tv-release-unsigned.apk
          sha256sum dist/*.apk > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cctv-tv-apks
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-results
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
